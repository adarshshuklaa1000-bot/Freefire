<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FREE FIRE LIKE</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background: #10151c;
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
}

.card {
    width: 92%;
    max-width: 430px;
    padding: 25px;
    border-radius: 18px;
    background: #1d2632;
    box-shadow: 0 10px 30px rgba(0,0,0,.4);
}

h1 {
    margin: 0 0 8px;
    text-align: center;
}

.subtitle {
    text-align: center;
    color: #aaa;
    margin-bottom: 25px;
}

label {
    display: block;
    margin: 12px 0 7px;
    font-weight: bold;
}

input,
select {
    width: 100%;
    padding: 14px;
    border: 0;
    border-radius: 10px;
    background: #303b47;
    color: white;
    font-size: 16px;
    outline: none;
}

button {
    width: 100%;
    margin-top: 20px;
    padding: 15px;
    border: 0;
    border-radius: 10px;
    background: #69d66b;
    color: #10151c;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

button:disabled {
    opacity: .6;
}

#result {
    margin-top: 20px;
    padding: 14px;
    border-radius: 10px;
    background: #303b47;
    white-space: pre-wrap;
    word-break: break-word;
}

.footer {
    text-align: center;
    margin-top: 20px;
    color: #888;
    font-size: 13px;
}
</style>
</head>

<body>

<div class="card">

    <h1>FREE FIRE LIKE</h1>
    <div class="subtitle">Enter UID and send likes</div>

    <label>🔍 Search / UID</label>
    <input
        id="uid"
        type="text"
        inputmode="numeric"
        placeholder="Enter Free Fire UID"
        autocomplete="off"
    >

    <label>🌍 Server</label>
    <select id="server">
        <option value="ind">India (IND)</option>
        <option value="bd">Bangladesh (BD)</option>
    </select>

    <button id="sendBtn" onclick="sendLike()">
        ❤️ SEND LIKE
    </button>

    <div id="result">Enter UID and press SEND LIKE.</div>

    <div class="footer">
        Powered by Adarsh Shukla
    </div>

</div>

<script>
async function sendLike() {

    const uid = document.getElementById("uid").value.trim();
    const server = document.getElementById("server").value;
    const result = document.getElementById("result");
    const button = document.getElementById("sendBtn");

    if (!/^[0-9]+$/.test(uid)) {
        result.textContent = "❌ Please enter a valid numeric UID.";
        return;
    }

    button.disabled = true;
    button.textContent = "⏳ Sending...";
    result.textContent = "Connecting to API...";

    try {

        const url =
            "/api/like?uid=" +
            encodeURIComponent(uid) +
            "&server_name=" +
            encodeURIComponent(server);

        const response = await fetch(url, {
            method: "GET",
            cache: "no-store"
        });

        const data = await response.json();

        console.log("API RESPONSE:", data);

        if (data.status === 1) {

            result.textContent =
                "✅ Like sent successfully!\n\n" +
                "Player: " + (data.PlayerNickname || "Unknown") + "\n" +
                "UID: " + (data.UID || uid) + "\n" +
                "Likes Before: " + (data.LikesbeforeCommand ?? "N/A") + "\n" +
                "Likes After: " + (data.LikesafterCommand ?? "N/A") + "\n" +
                "Likes Given: " + (data.LikesGivenByAPI ?? "N/A");

        } else {

            result.textContent =
                "❌ " + (data.error || "API rejected this UID/server.");
        }

    } catch (error) {

        console.error(error);

        result.textContent =
            "❌ Unable to connect to your backend.";
    }

    button.disabled = false;
    button.textContent = "❤️ SEND LIKE";
}
</script>

</body>
</html>
